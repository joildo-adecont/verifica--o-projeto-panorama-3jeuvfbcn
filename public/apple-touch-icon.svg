<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="sphereGradTouch" cx="42%" cy="38%" r="58%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>
    <linearGradient id="bgTouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <filter id="touchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1033" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo suave arredondado característico do Apple Touch Icon -->
  <rect width="180" height="180" rx="36" fill="url(#bgTouch)" />
  <rect width="180" height="180" rx="36" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Símbolo oficial ADECONT centralizado -->
  <g transform="translate(18, 14) scale(0.28)" filter="url(#touchShadow)">
    <!-- Arco azul marinho -->
    <path
      d="M 64 376 
         C 134 238, 206 116, 256 112 
         C 306 116, 378 238, 448 376 
         C 382 176, 330 144, 256 144 
         C 182 144, 130 176, 64 376 Z"
      fill="#0B1033"
    />
    <!-- Esfera azul vibrante -->
    <circle
      cx="256"
      cy="276"
      r="58"
      fill="url(#sphereGradTouch)"
    />
  </g>
</svg>