<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="favSphere" cx="49%" cy="46%" r="52%" fx="49%" fy="46%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#AEE1FA" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#7EC8F0" />
      <stop offset="78%" stop-color="#4FA8DC" />
      <stop offset="92%" stop-color="#2A7EB8" />
      <stop offset="100%" stop-color="#1B4F7D" />
    </radialGradient>
    <filter id="softCenterGlowFav" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centralizado 512x512 a partir do símbolo oficial -->
  <g transform="translate(256, 260) scale(0.68) translate(-486, -210)">
    <!-- Arco azul-marinho profundo oficial #2E2260 -->
    <path
      d="M 122 370
         C 142 320, 206 182, 326 84
         C 388 34, 452 0, 500 0
         C 548 0, 612 34, 674 84
         C 718 120, 742 186, 755 283
         C 745 220, 715 156, 650 114
         C 592 76, 540 106, 500 110
         C 458 114, 404 80, 344 116
         C 246 174, 178 266, 122 370 Z"
      fill="#2E2260"
    />

    <!-- Esfera circular sob o pico -->
    <circle
      cx="486"
      cy="216"
      r="59"
      fill="url(#favSphere)"
    />

    <!-- Glow difuso no centro -->
    <circle
      cx="486"
      cy="216"
      r="16"
      fill="#FFFFFF"
      opacity="0.82"
      filter="url(#softCenterGlowFav)"
    />
  </g>
</svg>