<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <!-- Símbolo ADECONT (Versão Branca para fundos escuros e impressão) -->
  <g id="simbolo">
    <!-- Círculo externo dourado -->
    <circle cx="40" cy="40" r="32" stroke="#D4AF37" stroke-width="2.5" fill="#0A192F" fill-opacity="0.2"/>
    <!-- Elementos geométricos internos dourado e branco -->
    <path d="M40 16 L60 52 L20 52 Z" stroke="#D4AF37" stroke-width="2" fill="none"/>
    <path d="M40 26 L52 48 L28 48 Z" fill="#D4AF37" fill-opacity="0.3"/>
    <!-- Linhas horizontais representando assessoria/contabilidade -->
    <line x1="28" y1="42" x2="52" y2="42" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="32" y1="46" x2="48" y2="46" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Ponto central de equilíbrio -->
    <circle cx="40" cy="36" r="2.5" fill="#D4AF37"/>
  </g>

  <!-- Tipografia ADECONT em Branco -->
  <text x="86" y="44" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">ADECONT</text>

  <!-- Linha divisória dourada -->
  <line x1="86" y1="52" x2="395" y2="52" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Tagline Oficial da ADECONT em cinza claro -->
  <text x="88" y="66" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="2.8">ASSESSORIA CONTÁBIL E ADMINISTRATIVA</text>
</svg>
