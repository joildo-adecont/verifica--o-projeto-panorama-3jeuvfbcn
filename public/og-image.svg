<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente de fundo elegante azul-marinho profundo condizente com a nova identidade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A24" />
      <stop offset="50%" stop-color="#1B133E" />
      <stop offset="100%" stop-color="#251A54" />
    </linearGradient>

    <!-- Gradiente oficial da esfera ADECONT -->
    <radialGradient id="sphereGradOG" cx="48%" cy="42%" r="56%" fx="46%" fy="38%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#A8DDF7" />
      <stop offset="55%" stop-color="#4FA8DC" />
      <stop offset="85%" stop-color="#1C75B7" />
      <stop offset="100%" stop-color="#145A91" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro azul marinho profundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Efeitos luminosos de fundo -->
  <circle cx="1060" cy="110" r="320" fill="#38BDF8" opacity="0.10" filter="blur(70px)" />
  <circle cx="140" cy="530" r="280" fill="#4FA8DC" opacity="0.08" filter="blur(60px)" />

  <!-- Grid decorativo geométrico suave -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
  </g>

  <!-- Logo oficial ADECONT topo à esquerda fiel ao novo traçado -->
  <g transform="translate(85, 45) scale(0.38)">
    <!-- Arco superior -->
    <path
      d="M 120 370
         C 175 295, 230 200, 315 115
         C 385 45, 445 10, 500 0
         C 555 10, 615 45, 685 115
         C 770 200, 825 295, 880 370
         C 800 230, 735 150, 650 90
         C 585 45, 545 28, 500 28
         C 455 28, 415 45, 350 90
         C 265 150, 200 230, 120 370 Z"
      fill="#FFFFFF"
    />

    <!-- Esfera central -->
    <circle cx="500" cy="215" r="58" fill="url(#sphereGradOG)" />

    <!-- Tipografia ADECONT -->
    <g fill="#FFFFFF">
      <!-- A -->
      <path d="M 5 430 L 55 350 L 115 350 L 142 430 L 110 430 L 100 400 L 48 400 L 36 430 Z M 57 375 L 92 375 L 85 355 L 65 355 Z" fill-rule="evenodd" />
      <!-- D -->
      <path d="M 155 350 L 225 350 C 255 350, 275 365, 275 390 C 275 415, 255 430, 225 430 L 155 430 Z M 183 373 L 183 407 L 218 407 C 235 407, 246 400, 246 390 C 246 380, 235 373, 218 373 Z" fill-rule="evenodd" />
      <!-- E -->
      <path d="M 290 350 L 375 350 L 375 373 L 318 373 L 318 381 L 368 381 L 368 401 L 318 401 L 318 407 L 375 407 L 375 430 L 290 430 Z" />
      <!-- C -->
      <path d="M 470 373 L 448 373 C 432 373, 420 380, 420 390 C 420 400, 432 407, 448 407 L 470 407 L 470 430 L 445 430 C 410 430, 390 415, 390 390 C 390 365, 410 350, 445 350 L 470 350 Z" />
      <!-- O -->
      <path d="M 525 350 C 560 350, 582 365, 582 390 C 582 415, 560 430, 525 430 C 490 430, 468 415, 468 390 C 468 365, 490 350, 525 350 Z M 525 373 C 542 373, 553 380, 553 390 C 553 400, 542 407, 525 407 C 508 407, 497 400, 497 390 C 497 380, 508 373, 525 373 Z" fill-rule="evenodd" />
      <!-- N -->
      <path d="M 598 350 L 626 350 L 674 407 L 674 350 L 702 350 L 702 430 L 674 430 L 626 373 L 626 430 L 598 430 Z" />
      <!-- T -->
      <path d="M 718 350 L 815 350 L 815 373 L 780 373 L 780 430 L 753 430 L 753 373 L 718 373 Z" />
    </g>

    <!-- ASSESSORIA -->
    <text x="500" y="472" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="28">A S S E S S O R I A</text>
    <line x1="5" y1="486" x2="995" y2="486" stroke="#94A3B8" stroke-width="3.2" stroke-opacity="0.8" />

    <!-- TAGLINE SEM A PALAVRA JURÍDICA -->
    <text x="500" y="534" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="12">CONTÁBIL E ADMINISTRATIVA</text>
  </g>

  <!-- Badge temática -->
  <g transform="translate(90, 310)">
    <rect width="280" height="36" rx="18" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="140" y="23" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GUIA TÉCNICO &amp; OPERACIONAL</text>
  </g>

  <!-- Título principal -->
  <text x="90" y="400" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Panorama da Reforma Tributária
  </text>
  <text x="90" y="455" fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1">
    IBS, CBS e o Novo Sistema Fiscal Brasileiro
  </text>

  <!-- Subtítulo / destaques -->
  <text x="90" y="515" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
    Normas Oficiais • Fato Gerador • Alíquotas • Cronograma 2026–2033 • Fontes CGIBS &amp; RFB
  </text>

  <!-- Rodapé informativo -->
  <line x1="90" y1="555" x2="1110" y2="555" stroke="#334155" stroke-width="1" />
  <text x="90" y="590" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
    ADECONT ASSESSORIA CONTÁBIL E ADMINISTRATIVA
  </text>
  <text x="1110" y="590" text-anchor="end" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    www.adecont.com.br
  </text>
</svg>
