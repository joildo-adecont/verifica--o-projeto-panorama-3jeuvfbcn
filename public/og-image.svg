<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente de fundo elegante azul-marinho profundo condizente com a nova identidade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A24" />
      <stop offset="50%" stop-color="#1B133E" />
      <stop offset="100%" stop-color="#2E2260" />
    </linearGradient>

    <!-- Gradiente oficial da esfera ADECONT -->
    <radialGradient id="sphereGradOG" cx="49%" cy="46%" r="52%" fx="49%" fy="46%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#AEE1FA" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#7EC8F0" />
      <stop offset="78%" stop-color="#4FA8DC" />
      <stop offset="92%" stop-color="#2A7EB8" />
      <stop offset="100%" stop-color="#1B4F7D" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro azul marinho profundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Efeitos luminosos de fundo -->
  <circle cx="1060" cy="110" r="320" fill="#38BDF8" opacity="0.10" filter="blur(70px)" />
  <circle cx="140" cy="530" r="280" fill="#4FA8DC" opacity="0.08" filter="blur(60px)" />

  <!-- Grid decorativo geométrico suave -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
  </g>

  <!-- Logo oficial ADECONT topo à esquerda fiel ao novo traçado -->
  <g transform="translate(85, 45) scale(0.38)">
    <!-- Arco superior -->
    <path
      d="M 122 370
         C 142 320, 206 182, 326 84
         C 388 34, 452 0, 500 0
         C 548 0, 612 34, 674 84
         C 718 120, 742 186, 755 283
         C 745 220, 715 156, 650 114
         C 592 76, 540 106, 500 110
         C 458 114, 404 80, 344 116
         C 246 174, 178 266, 122 370 Z"
      fill="#FFFFFF"
    />

    <!-- Esfera central -->
    <circle cx="486" cy="216" r="59" fill="url(#sphereGradOG)" />
    <circle cx="486" cy="216" r="16" fill="#FFFFFF" opacity="0.85" />

    <!-- Tipografia ADECONT -->
    <g fill="#FFFFFF">
      <!-- A -->
      <path d="M 68 350 L 142 350 L 142 430 L 106 430 L 106 408 L 42 408 L 24 430 L 2 430 L 68 350 Z M 64 380 L 106 380 L 106 368 L 74 368 Z" fill-rule="evenodd" />
      <!-- D -->
      <path d="M 156 350 L 230 350 C 264 350, 282 366, 282 390 C 282 414, 264 430, 230 430 L 156 430 Z M 190 373 L 190 407 L 225 407 C 244 407, 250 400, 250 390 C 250 380, 244 373, 225 373 Z" fill-rule="evenodd" />
      <!-- E -->
      <path d="M 296 350 L 404 350 L 404 373 L 330 373 L 330 378 L 396 378 L 396 401 L 330 401 L 330 407 L 404 407 L 404 430 L 296 430 Z" />
      <!-- C -->
      <path d="M 434 350 L 512 350 L 512 373 L 468 373 C 452 373, 444 380, 444 390 C 444 400, 452 407, 468 407 L 512 407 L 512 430 L 434 430 C 416 430, 410 416, 410 390 C 410 364, 416 350, 434 350 Z" />
      <!-- O -->
      <path d="M 548 350 L 626 350 C 644 350, 650 364, 650 390 C 650 416, 644 430, 626 430 L 548 430 C 530 430, 524 416, 524 390 C 524 364, 530 350, 548 350 Z M 558 373 C 552 373, 548 380, 548 390 C 548 400, 552 407, 558 407 L 616 407 C 622 407, 626 400, 626 390 C 626 380, 622 373, 616 373 Z" fill-rule="evenodd" />
      <!-- N -->
      <path d="M 664 350 L 698 350 L 758 407 L 758 350 L 790 350 L 790 430 L 756 430 L 696 373 L 696 430 L 664 430 Z" />
      <!-- T -->
      <path d="M 798 350 L 960 350 L 960 373 L 896 373 L 896 430 L 862 430 L 862 373 L 798 373 Z" />
    </g>

    <!-- ASSESSORIA -->
    <text x="486" y="473" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="35" font-weight="900" letter-spacing="34">A S S E S S O R I A</text>
    <line x1="2" y1="488" x2="970" y2="488" stroke="#94A3B8" stroke-width="3.2" stroke-opacity="0.85" />

    <!-- TAGLINE OFICIAL: CONTÁBIL E ADMINISTRATIVA -->
    <text x="486" y="534" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="16">CONTÁBIL E ADMINISTRATIVA</text>
  </g>

  <!-- Badge temática -->
  <g transform="translate(90, 310)">
    <rect width="280" height="36" rx="18" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="140" y="23" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GUIA TÉCNICO &amp; OPERACIONAL</text>
  </g>

  <!-- Título principal -->
  <text x="90" y="400" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Panorama da Reforma Tributária
  </text>
  <text x="90" y="455" fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1">
    IBS, CBS e o Novo Sistema Fiscal Brasileiro
  </text>

  <!-- Subtítulo / destaques -->
  <text x="90" y="515" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
    Normas Oficiais • Fato Gerador • Alíquotas • Cronograma 2026–2033 • Fontes CGIBS &amp; RFB
  </text>

  <!-- Rodapé informativo -->
  <line x1="90" y1="555" x2="1110" y2="555" stroke="#334155" stroke-width="1" />
  <text x="90" y="590" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
    ADECONT ASSESSORIA CONTÁBIL E ADMINISTRATIVA
  </text>
  <text x="1110" y="590" text-anchor="end" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    www.adecont.com.br
  </text>
</svg>